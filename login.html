<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Ecosystem of self-creation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
		<form action="" method="post">

			<div class="brand">
				<img src="Architect_Logo.png" alt="Architect logo" class="logo" width="56" height="56">
				<p class="brand-tagline">Ecosystem of self-creation</p>
			</div>

			<fieldset>
				<legend class="title">Вход</legend>

				<div class="form-group">
					<label for="email">Почта</label>
					<input type="email" placeholder="example@mail.ru" id="email" name="email" required inputmode="email" autocomplete="email" aria-describedby="email-error">
					<span class="error" id="email-error" role="alert"></span>
				</div>

				<div class="form-group">
					<label for="password">Пароль</label>
					<input type="password" placeholder="Минимум 8 символов" id="password" name="password" minlength="8" required autocomplete="current-password">
				</div>

				<div class="form-group">
					<button type="submit">Отправить</button>
				</div>

				<p class="login-link">Нет аккаунта?  <a href="register.html">Зарегистрироваться</a></p>

                <p class="reset-password-link">Забыли пароль?  <a href="reset-password.html">Восстановить</a></p>

			</fieldset>
		</form>
	</main>
	<script src="script.JS"></script>
</body>

</html>
